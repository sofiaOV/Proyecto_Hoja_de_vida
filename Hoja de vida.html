<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de vida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body style="background: linear-gradient(135deg, #667eea, #764ba2);">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg border-0" style="width: 420px; border-radius: 15px;">
        
        <div class="card-body">
            <h3 class="text-center mb-4 text-primary">Vacantes laborales</h3>

            <form id="formulario">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ingrese su nombre" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cargo</label>
                    <input type="text" name="cargo" class="form-control" placeholder="Cargo" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Experiencia</label>
                    <textarea name="experiencia" class="form-control" rows="3" placeholder="Describe tu experiencia" required></textarea>
                </div>

                

                <button class="btn btn-primary w-100 fw-bold">
                    Guardar candidato
                </button>

            </form>

            <div id="mensaje" class="mt-3"></div>
            <ul id="lista" class="list-group mt-4"></ul>

        </div>
    </div>

</div>

    
    
    
</body>
</html>
